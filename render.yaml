services:
  - type: web
    name: railnexus-brain
    runtime: python
    rootDir: railnexus-brain
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  - type: web
    name: railnexus-backend
    runtime: node
    rootDir: Backend
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: REFRESH_TOKEN_EXPIRY
        value: 10d
      - key: BRAIN_SERVICE_URL
        sync: false
      - key: BRAIN_TIMEOUT_MS
        value: 30000
      - key: CORS_ORIGIN
        sync: false